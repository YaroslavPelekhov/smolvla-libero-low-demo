version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      safe-python-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # These versions are part of the measured WSL/CUDA environment.
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: torchcodec
      - dependency-name: av
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      safe-action-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
