[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vla-budget"
version = "0.1.0"
description = "Leakage-safe low-demo adaptation protocol for SmolVLA on LIBERO"
readme = "README.md"
authors = [{ name = "Yaroslav Pelekhov", email = "pelekhovym@my.msu.ru" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "huggingface-hub>=0.34,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pyarrow>=18,<26",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
  "safetensors>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]
bonus = ["av>=15,<16", "torch>=2.7,<3", "torchvision>=0.22,<1"]

[project.urls]
Repository = "https://github.com/YaroslavPelekhov/smolvla-libero-low-demo"
Documentation = "https://github.com/YaroslavPelekhov/smolvla-libero-low-demo/tree/main/docs"
Issues = "https://github.com/YaroslavPelekhov/smolvla-libero-low-demo/issues"

[project.scripts]
vla-download = "vla_budget.download:main"
vla-manifest = "vla_budget.protocol:main"
vla-preregister = "vla_budget.preregister:main"
vla-run = "vla_budget.runner:main"
vla-aggregate = "vla_budget.aggregate:main"
vla-progress = "vla_budget.progress_critic:main"
vla-bonus = "vla_budget.bonus:main"
vla-failures = "vla_budget.failures:main"
vla-doctor = "vla_budget.doctor:main"
vla-subset = "vla_budget.subset:main"
vla-soup = "vla_budget.model_soup:main"
vla-compare = "vla_budget.compare_methods:main"
vla-verify = "vla_budget.verify_submission:main"
vla-distance = "vla_budget.checkpoint_distance:main"
vla-task-vector = "vla_budget.task_vector_soup:main"
vla-alignment = "vla_budget.task_vector_alignment:main"
vla-consensus-vector = "vla_budget.consensus_task_vector:main"
vla-adaptive-merge = "vla_budget.adaptive_merge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_budget"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
